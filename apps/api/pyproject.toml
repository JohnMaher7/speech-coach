[project]
name = "speech-coach-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.99.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.3",
    "clerk-backend-api>=5.0.6",
    "deepgram-sdk>=7.0.0",
    "fastapi[standard]>=0.136.1",
    "librosa>=0.11.0",
    "praat-parselmouth>=0.4.7",
    "pydantic-settings>=2.14.0",
    "rapidfuzz>=3.10.0",
    "sentry-sdk[fastapi]>=2.20.0",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.38",
]

[project.scripts]
speakgrade-eval = "eval.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "eval"]

[dependency-groups]
dev = [
    "modal>=1.4.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: integration tests that call the real Claude API (run with -m eval)",
]
addopts = "-m 'not eval'"
